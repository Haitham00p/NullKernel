name: NullOS Limine build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: limine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bios-build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build and boot-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils nasm make curl ca-certificates \
            qemu-system-x86 dosfstools mtools fdisk
      - name: Build NullOS kernel
        run: make -j2
      - name: Inspect ELF and Limine request sections
        run: |
          readelf -lW build/kernel.elf
          readelf -SW build/kernel.elf
          objdump -d -Mintel --disassemble=kernel_entry build/kernel.elf
          nm -an build/kernel.elf | grep -E 'LimineBootPrepare|kernel_entry|kernel_main'
          readelf -SW build/kernel.elf | grep -E 'limine_requests'
          if objdump -d -Mintel build/kernel.elf | grep -E '\b(shrx|shlx|sarx|mulx|rorx|pdep|pext|bzhi|andn)\b'; then
            echo "ERROR: kernel contains instructions outside the x86-64 baseline"
            exit 1
          fi
      - name: Fetch pinned Limine release and install hybrid disk
        run: make install DISK=/tmp/nullos-limine.img
      - name: Verify BIOS and UEFI payloads and no-menu policy
        run: |
          grep -qx 'timeout: 0' boot/limine.conf
          sfdisk --dump /tmp/nullos-limine.img | grep -qi 'type=ef'
          mcopy -i /tmp/nullos-limine.img@@1048576 ::/EFI/BOOT/BOOTX64.EFI /tmp/BOOTX64.EFI
          mcopy -i /tmp/nullos-limine.img@@1048576 ::/BOOT/LIMINE/LIMINE-BIOS.SYS /tmp/limine-bios.sys
          test -s /tmp/BOOTX64.EFI
          test -s /tmp/limine-bios.sys
      - name: QEMU BIOS handoff and Normal shell smoke test
        run: bash tests/limine-smoke.sh /tmp/nullos-limine.img
